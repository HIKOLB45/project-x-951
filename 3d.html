<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>3D View | CANOPY OS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <nav class="nav-fixed"><div class="logo-text">3D_CORE</div><a href="index.html" style="color:white">BACK</a></nav>
    <div id="canvas-container" style="width: 100%; height: 100vh;"></div>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        const geometry = new THREE.BoxGeometry(5, 0.1, 4.8);
        const material = new THREE.MeshBasicMaterial({ color: 0x00f2ff, wireframe: true });
        const roof = new THREE.Mesh(geometry, material);
        scene.add(roof);
        camera.position.z = 7;
        function animate() { requestAnimationFrame(animate); roof.rotation.y += 0.01; renderer.render(scene, camera); }
        animate();
    </script>
</body>
</html>
